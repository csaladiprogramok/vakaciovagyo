<!DOCTYPE html>

<head>

<title>Nyaraláskereső 2027</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;color:#17324d;min-height:100vh;background:radial-gradient(circle at top left,#fff4cf 0%,transparent 34%),linear-gradient(135deg,#f3d7a4,#fffaf0)}
.page{width:min(1040px,100%);margin:auto;padding:20px 16px 55px}
.top-box{width:min(820px,100%);margin:0 auto 18px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);border-radius:20px;padding:14px 16px 13px;box-shadow:0 12px 28px rgba(75,60,25,.12);text-align:left}
.hero{text-align:left;padding:0}
h1{margin-top:8px;font-size:clamp(25px,5vw,38px);font-weight:900;letter-spacing:-2px;background:linear-gradient(90deg,#087f8c,#00b8c8,#ffb703,#ff8c42,#087f8c);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:colors 5s linear infinite;text-align:left}
.subtitle{margin-top:12px;font-size:clamp(15px,2.5vw,19px);font-style:italic;color:#566b73;text-align:justify;text-justify:inter-word;hyphens:auto}
.update-note{margin-top:22px;max-width:850px;font-size:15px;line-height:1.65;color:#566b73;text-align:justify;text-justify:inter-word;hyphens:auto}.update-note strong{color:#087f8c}
.agency-title{font-size:clamp(18px,3vw,23px);font-weight:900;margin:18px auto 9px;color:#087f8c;text-align:left;width:min(820px,100%)}
.agency-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;width:min(820px,100%);margin:0 auto}
.agency-btn{width:100%;height:76px;border:0;border-radius:15px;overflow:hidden;cursor:pointer;position:relative;background:#fff;box-shadow:0 14px 35px rgba(80,60,20,.13);transition:transform .3s ease,box-shadow .3s ease}.agency-btn:hover{transform:translateY(-6px);box-shadow:0 22px 42px rgba(75,60,25,.2)}.agency-btn img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}.agency-btn:hover img{transform:scale(1.06)}.agency-btn span{position:absolute;left:0;right:0;bottom:0;padding:7px 9px;color:#fff;font-weight:900;font-size:13px;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.agency-card{display:none;width:min(820px,100%);max-width:820px;margin:12px auto 0;background:rgba(255,255,255,.96);border-radius:25px;overflow:hidden;box-shadow:0 16px 38px rgba(75,60,25,.14);animation:cardIn .65s ease both}.agency-card.show{display:block}.card-image{height:150px;overflow:hidden;background:linear-gradient(135deg,#7ddfe9,#f4d28d)}.card-image img{width:100%;height:100%;object-fit:cover;display:block}.card-body{padding:15px}.agency-name{font-size:23px;color:#087f8c;margin-bottom:14px}.country-tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}.country-tab{border:1px solid rgba(8,127,140,.18);background:#e9f8f8;color:#087f8c;border-radius:999px;padding:9px 14px;font-weight:800;cursor:pointer;transition:.2s}.country-tab.active,.country-tab:hover{background:linear-gradient(135deg,#00b4c4,#087f8c);color:white}.offer-title{font-size:20px;color:#087f8c;margin-bottom:10px}.offer-text{font-size:14px;line-height:1.65;color:#60727b;margin-bottom:20px;text-align:justify;text-justify:inter-word;hyphens:auto}.details-btn{display:inline-block;text-decoration:none;color:white;font-weight:800;padding:12px 19px;border-radius:999px;background:linear-gradient(135deg,#00b4c4,#087f8c);box-shadow:0 8px 20px rgba(8,127,140,.28);transition:.25s}.details-btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 12px 24px rgba(8,127,140,.36)}
.close-btn{position:absolute;top:13px;right:15px;text-decoration:none;font-size:24px;font-weight:700;color:#333;background:#f1f1f1;border:1px solid #ccc;border-radius:50%;width:35px;height:35px;display:flex;align-items:center;justify-content:center;transition:.3s}.close-btn:hover{background:#ff4d4d;color:#fff;border-color:#ff1a1a}
@keyframes colors{from{background-position:0 center}to{background-position:300% center}}@keyframes cardIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:620px){
.page{width:100%;padding:10px 10px 32px}
.top-box,.agency-title,.agency-grid,.agency-card{width:100%;max-width:820px}
.top-box{padding:12px 13px 11px;border-radius:17px}
.hero{padding:0}
h1{font-size:clamp(23px,7.5vw,31px);line-height:1.08;letter-spacing:-.5px;overflow-wrap:anywhere}
.subtitle{font-size:13px;line-height:1.35;margin-top:7px;text-align:justify}
.update-note{font-size:12px;line-height:1.4;margin-top:10px;text-align:justify}
.agency-title{font-size:19px;margin-top:15px;margin-bottom:8px}
.agency-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.agency-btn{height:68px;border-radius:13px}
.agency-btn span{font-size:11.5px;padding:6px 7px}
.agency-card{border-radius:18px;margin-top:10px}
.card-image{height:130px}
.card-body{padding:13px}
.agency-name{font-size:21px;margin-bottom:10px}
.country-tabs{gap:6px;margin-bottom:13px}
.country-tab{font-size:12px;padding:7px 9px}
.offer-title{font-size:18px}
.offer-text{font-size:13px;line-height:1.5;margin-bottom:15px;text-align:justify}
.details-btn{width:100%;text-align:center;padding:11px 14px;font-size:13px}
}
@media(max-width:460px){
.page{padding-left:7px;padding-right:7px}
.top-box,.agency-title,.agency-grid,.agency-card{width:calc(100vw - 14px);max-width:none}
.agency-btn{height:61px}
.agency-btn span{font-size:10.5px}
h1{font-size:23px}
}

@media (max-width: 620px){
  body{overflow-x:hidden}
  .page{width:100%;max-width:100%;padding-left:10px;padding-right:10px}
  .top-box,.agency-title,.agency-grid,.agency-card{
    width:100%;
    max-width:100%;
    margin-left:auto;
    margin-right:auto;
  }
  .agency-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .agency-btn{min-width:0}
  .country-tabs{width:100%}
}
@media (max-width: 360px){
  .agency-grid{gap:5px}
  .country-tab{font-size:11px;padding:7px 8px}
}


/* 16:9 arányú, reszponzív képek */
.agency-btn{
  height:auto !important;
  aspect-ratio:16 / 9;
}
.agency-btn img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card-image{
  height:auto !important;
  aspect-ratio:16 / 9;
}
.card-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* Mobilon a két irodakép továbbra is egymás mellett marad,
   ezért természetesen kisebb 16:9-es bélyegképek lesznek. */
@media(max-width:620px){
  .agency-btn{
    height:auto !important;
    aspect-ratio:16 / 9;
  }
  .card-image{
    height:auto !important;
    aspect-ratio:16 / 9;
  }
}


/* Jól olvasható ajánlati felsorolás */
.offer-text ul,
.offer-text ol,
.offer-list{
  margin:10px 0 14px 0;
  padding-left:28px;
  list-style-position:outside;
}
.offer-text li,
.offer-list li{
  padding-left:4px;
  margin:4px 0;
  line-height:1.45;
}
.offer-text{
  overflow-wrap:anywhere;
}

/* A valódi török zászló megjelenítése CSS-ből, emoji helyett */
.tr-flag{
  display:inline-block;
  width:22px;
  aspect-ratio:3 / 2;
  margin-right:7px;
  vertical-align:-3px;
  border-radius:2px;
  background:#e30a17;
  position:relative;
  box-shadow:0 0 0 1px rgba(0,0,0,.08);
}
.tr-flag::before{
  content:"";
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#fff;
  left:5px;
  top:4px;
}
.tr-flag::after{
  content:"★";
  position:absolute;
  color:#fff;
  font-size:7px;
  line-height:1;
  left:12px;
  top:5px;
  transform:rotate(8deg);
}
.tr-flag .cut{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#e30a17;
  left:8px;
  top:5px;
  z-index:2;
}

@media(max-width:620px){
  .offer-text ul,
  .offer-text ol,
  .offer-list{
    padding-left:25px;
  }
  .offer-text li,
  .offer-list li{
    padding-left:3px;
  }
}


/* Magasabb országválasztó gombok – a zászló biztosan teljesen kifér */
.country-tab{
  min-height:48px;
  padding:10px 16px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  line-height:1.2;
  white-space:nowrap;
  overflow:visible;
}
.country-tab .tr-flag{
  flex:0 0 24px;
  width:24px;
  height:16px;
  margin-right:0;
  vertical-align:middle;
  overflow:visible;
}

@media(max-width:620px){
  .country-tab{
    min-height:44px;
    padding:9px 12px;
    font-size:12px;
  }
  .country-tab .tr-flag{
    flex-basis:22px;
    width:22px;
    height:15px;
  }
}
.coming-soon {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      margin: 0 auto 22px;
      text-align: center
    }

    .coming-soon h2 {
      flex: 0 0 auto;
      font-size: clamp(30px, 5vw, 52px);
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #087f8c, #00b8c8, #ffb703, #ff8c42, #087f8c);
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 6px 12px rgba(8, 127, 140, .13));
      animation: colors 5s linear infinite, soonFloat 2.8s ease-in-out infinite
    }

    .coming-line {
      width: min(150px, 15vw);
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, #00a9b7, #ffb703, transparent)
    }

    @keyframes soonFloat {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-5px)
      }
    }

</style>
</head>
