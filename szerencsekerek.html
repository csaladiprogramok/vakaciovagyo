<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Szerencsekerék</title>

<style>
.close-btn{
    position:absolute;
    top:8px;
    right:12px;
    text-decoration:none;
    font-size:20px;
    font-weight:700;
    color:#333;
    background:#f1f1f1;
    border:1px solid #ccc;
    border-radius:50%;
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.3s;
}

.close-btn:hover{
    background:#ff4d4d;
    color:#fff;
    border-color:#ff1a1a;
}

*{
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:#fefcc8;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:8px;
    color:#06214a;
}

.container{
    position:relative;
    width:100%;
    max-width:780px;
    background:linear-gradient(135deg,#00aaff 0%,#fff3b0 50%,#ffcc00 100%);
    border-radius:18px;
    border:3px dashed #fff;
    box-shadow:0 6px 18px rgba(0,0,0,.22);
    padding:14px;
    text-align:center;
}

h1{
    margin:0;
    font-size:30px;
    color:#fff;
    text-shadow:2px 2px #06326e;
}

h2{
    display:inline-block;
    background:#06326e;
    color:#fff;
    padding:6px 16px;
    border-radius:8px;
    margin:6px 0 8px;
    font-size:18px;
}

.top-links{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin:4px 0 10px;
}

.link-btn{
    display:inline-block;
    text-decoration:none;
    background:linear-gradient(135deg,#ffcc00,#ff8c00);
    color:#06326e;
    font-weight:bold;
    font-size:13px;
    padding:8px 12px;
    border-radius:25px;
    box-shadow:0 3px 0 #b86600;
}

.link-btn:hover{
    transform:translateY(-1px);
}

.main{
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
}

.left,
.right{
    flex:1;
    min-width:240px;
}

p{
    margin:7px 0 3px;
    font-size:14px;
}

input,
select{
    width:100%;
    max-width:280px;
    padding:8px;
    font-size:14px;
    border-radius:10px;
    border:2px dashed #0077cc;
    text-align:center;
    margin-top:4px;
}

#codeInput{
    font-size:18px;
    letter-spacing:4px;
    text-transform:uppercase;
}

button{
    margin-top:10px;
    padding:10px 24px;
    border:none;
    border-radius:35px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#ffcc00,#ff8c00);
    color:#06326e;
}

.rules{
    margin-top:8px;
    display:flex;
    justify-content:center;
}

.rules-label{
    display:flex;
    align-items:flex-start;
    gap:8px;
    max-width:280px;
    text-align:center;
    line-height:1.25;
    font-size:14px;
}

.rules-label input{
    width:15px;
    height:15px;
    margin-top:2px;
    flex-shrink:0;
}

.rules-label a{
    color:#0056b3;
    font-weight:bold;
    text-decoration:none;
}

.wheel-wrap{
    position:relative;
    width:190px;
    height:190px;
    margin:auto;
}

.pointer{
    position:absolute;
    left:50%;
    top:-8px;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:15px solid transparent;
    border-right:15px solid transparent;
    border-top:28px solid #ffcc00;
    z-index:2;
}

.wheel{
    width:190px;
    height:190px;
    border-radius:50%;
    border:8px solid #ffcc00;
    background:conic-gradient(
        #2fa84f 0 270deg,
        #008bd2 270deg 306deg,
        #7b3fa1 306deg 342deg,
        #e52626 342deg 360deg
    );
    box-shadow:inset 0 0 0 4px #06326e,0 6px 12px rgba(0,0,0,.3);
    position:relative;
    transform:translateZ(0) rotate(0deg);
    will-change:transform;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
}

.wheel::after{
    content:"★";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:42px;
    height:42px;
    border-radius:50%;
    background:#ffcc00;
    border:3px solid #fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    color:#06326e;
}

.result{
    margin-top:10px;
    padding:9px;
    background:#fff;
    border-radius:10px;
    min-height:45px;
    font-size:14px;
}

.prizes{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
}

.prize{
    padding:6px 10px;
    border-radius:7px;
    color:#fff;
    font-weight:bold;
    font-size:13px;
}

.p1{background:#2fa84f;}
.p2{background:#008bd2;}
.p3{background:#7b3fa1;}
.p4{background:#e52626;}

.footer{
    margin-top:10px;
    background:#06326e;
    color:#fff;
    padding:7px;
    border-radius:8px;
    font-size:12px;
}

@media(max-width:768px){
    body{
        align-items:flex-start;
    }

    .main{
        flex-direction:column-reverse;
        gap:10px;
    }

    .wheel-wrap{
        width:240px;
        height:240px;
    }

    .wheel{
        width:240px;
        height:240px;
    }

    .wheel::after{
        width:36px;
        height:36px;
        font-size:17px;
    }

    h1{
        font-size:25px;
    }

    h2{
        font-size:15px;
    }

    input,
    select,
    button{
        max-width:100%;
    }

    .link-btn{
        width:100%;
        max-width:300px;
    }
}
.info-box{
    margin:12px auto 16px;
    max-width:650px;
    background:#fff;
    border-left:6px solid #ff9800;
    border-radius:12px;
    padding:12px 16px;
    font-size:14px;
    line-height:1.5;
    color:#06214a;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.info-box strong{
    color:#d97706;
}

.info-box b{
    color:#06326e;
}
a {
    text-decoration: none;
    color: blue;
}
@media(max-width:768px){
    .info-box{
        font-size:13px;
        padding:10px 12px;
    }
}

/* Letisztított, reszponzív megjelenés */
:root{--navy:#082a55;--blue:#087fc4;--gold:#ffc928;--cream:#fffbea;--card:#ffffff;--danger:#d92d20;}
body{background:linear-gradient(160deg,#eef8ff 0%,#fff9df 55%,#fff3bd 100%);padding:clamp(10px,2.5vw,28px);align-items:flex-start;}
.container{max-width:920px;margin:auto;padding:clamp(16px,3vw,30px);border:0;border-radius:24px;background:linear-gradient(145deg,#0a8fd8 0%,#51b9e9 28%,#fff2a6 70%,#ffc928 100%);box-shadow:0 18px 50px rgba(6,33,74,.18);overflow:hidden;}
h1{font-size:clamp(28px,5vw,46px);letter-spacing:.04em;}
h2{font-size:clamp(14px,2.5vw,19px);letter-spacing:.12em;margin:8px 0 14px;}
.info-box{max-width:720px;margin:8px auto 22px;border:0;border-left:5px solid var(--gold);padding:14px 18px;}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.85fr);gap:clamp(20px,4vw,42px);align-items:center;}
.left,.right{min-width:0;}
.left{background:rgba(255,255,255,.94);padding:clamp(16px,3vw,24px);border-radius:18px;box-shadow:0 10px 24px rgba(6,33,74,.12);}
p{margin:12px 0 5px;}
input,select{max-width:none;min-height:46px;background:#fff;border:1px solid #b8d5e8;border-radius:12px;outline:none;}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(8,127,196,.14);}
#codeInput{font-size:20px;letter-spacing:.32em;font-weight:700;}
.rules-label{max-width:none;text-align:left;align-items:center;}
.rules-label input{width:18px;height:18px;}
button{width:100%;min-height:50px;margin-top:16px;box-shadow:0 5px 0 #b56b00;transition:transform .15s ease,box-shadow .15s ease;}
button:hover{transform:translateY(-1px);}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #b56b00;}
.result{margin-top:16px;min-height:52px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(6,33,74,.08);}
.wheel-wrap,.wheel{width:min(310px,38vw);height:min(310px,38vw);}
.wheel::after{width:52px;height:52px;font-size:24px;}
.prizes{margin-top:22px;gap:9px;}
.prize{padding:8px 14px;border-radius:999px;}
.footer{margin-top:16px;padding:10px 14px;line-height:1.45;}
.close-btn{position:absolute;top:14px;right:14px;width:38px;height:38px;background:rgba(255,255,255,.9);border:0;box-shadow:0 3px 12px rgba(0,0,0,.12);}
@media(max-width:720px){body{padding:0;background:#f4fbff}.container{min-height:100vh;border-radius:0;padding:16px 12px 22px}.main{grid-template-columns:1fr;display:flex;flex-direction:column-reverse;gap:18px}.right{width:100%}.wheel-wrap,.wheel{width:min(72vw,280px);height:min(72vw,280px)}.left{width:100%;padding:16px}.info-box{margin-bottom:16px;text-align:left}h1{padding:0 34px}.close-btn{top:10px;right:10px}.prizes{gap:6px}.prize{flex:1 1 44%;max-width:150px}.footer{font-size:11px}}
@media(max-width:380px){.wheel-wrap,.wheel{width:230px;height:230px}h1{font-size:25px}.container{padding-left:10px;padding-right:10px}}

/* Kompakt asztali nézet – 900px felett egy képernyőre optimalizálva */
@media (min-width:721px){
  body{height:100vh;min-height:620px;padding:10px;align-items:center;overflow:hidden;}
  .container{max-width:820px;max-height:calc(100vh - 20px);padding:12px 18px 10px;border-radius:18px;overflow:auto;}
  h1{font-size:28px;line-height:1.05;}
  h2{font-size:14px;padding:5px 14px;margin:4px 0 7px;}
  .info-box{max-width:680px;margin:3px auto 9px;padding:8px 12px;font-size:12px;line-height:1.3;border-left-width:4px;}
  .main{grid-template-columns:minmax(0,1fr) 250px;gap:18px;}
  .left{padding:12px 16px;border-radius:14px;}
  p{margin:6px 0 3px;font-size:12px;}
  input,select{min-height:36px;padding:6px 9px;font-size:13px;border-radius:9px;}
  #codeInput{font-size:16px;}
  .rules{margin-top:6px;}
  .rules-label{font-size:11px;line-height:1.2;gap:6px;}
  .rules-label input{width:15px;height:15px;}
  button{min-height:38px;margin-top:8px;padding:7px 20px;font-size:14px;}
  .result{margin-top:8px;min-height:38px;padding:6px;font-size:12px;}
  .wheel-wrap,.wheel{width:225px;height:225px;}
  .wheel{border-width:7px;}
  .wheel::after{width:40px;height:40px;font-size:18px;}
  .pointer{top:-7px;border-left-width:12px;border-right-width:12px;border-top-width:22px;}
  .prizes{margin-top:9px;gap:6px;}
  .prize{padding:5px 10px;font-size:11px;}
  .footer{margin-top:7px;padding:6px 10px;font-size:10px;line-height:1.25;}
  .close-btn{top:9px;right:9px;width:30px;height:30px;font-size:18px;}
}

</style>
</head>

<body>
<div class="container">
<a href="rangom.html" class="close-btn" aria-label="Vissza az akciókhoz">×</a>

<h1>VAKÁCIÓVÁGYÓ</h1>
<h2>SZERENCSEKERÉK</h2>
<!------
<h4 style="color: white;background-color: red;font-size: 12px;"><b><i> FIGYELEM! - A mobilos pörgetés hibáján a megfelelő működés érdekében dolgozunk! <br>Köszönjük a türelmet!</i></b></h4>
--->

<div class="info-box">
    <strong>SZERENCSEKERÉK</strong><br>
    Add meg a neved és az 5 karakteres kódodat, majd fogadd el a játékszabályzatot.
    
</div>
<div class="main">
<div class="left">

<p><b>Név megadása:</b></p>
<input id="nameInput" type="text" placeholder="NÉV">

<p><b>Írd be az 5 karakteres kódodat:</b></p>
<input id="codeInput" maxlength="5" placeholder="_____" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" oninput="this.value=this.value.replace(/\s+/g,'').toUpperCase().slice(0,5)">

<div class="rules">
<label class="rules-label">
<input type="checkbox" id="acceptRules">
<span>
Elfogadom a játékszabályzatot,
<a href="pontgyujtoszabalyzat2.0.html" target="_blank">amit ide kattintva elolvastam.</a>
</span>
</label>
</div>

<button onclick="spinWheel()">PÖRGETÉS</button>

<div class="result" id="result">Sok szerencsét! 🎁</div>

</div>

<div class="right">
<div class="wheel-wrap">
<div class="pointer"></div>
<div class="wheel" id="wheel" style="transform:translateZ(0) rotate(0deg);"></div>
</div>
</div>
</div>

<div class="prizes">
<div class="prize p1">1000 Ft</div>
<div class="prize p2">2000 Ft</div>
<div class="prize p3">3000 Ft</div>
<div class="prize p4">5000 Ft</div>
</div>


</div>

<script>
const validCodes = {
    "ABCDE": 1,
    "ABBDE": 1
};

let spinning=false,currentRotation=0;

function randomBetween(a,b){
    return Math.floor(Math.random()*(b-a+1))+a;
}

function getPrize(){
    let r=Math.random()*100;
    return r<75?1000:r<85?2000:r<95?3000:5000;
}

function getTargetDegree(p){
    if(p===1000)return randomBetween(40,250);
    if(p===2000)return randomBetween(280,300);
    if(p===3000)return randomBetween(315,335);
    return randomBetween(348,357);
}

function spinWheel(){
    const name=document.getElementById("nameInput").value.trim();
    const code=document.getElementById("codeInput").value.replace(/\s+/g,"").trim().toUpperCase();
    const rules=document.getElementById("acceptRules").checked;
    const result=document.getElementById("result");
    const wheel=document.getElementById("wheel");

    if(spinning)return;

    if(name.length<2){
        result.style.color="red";
        result.innerHTML="Add meg a neved!";
        return;
    }

    if(code.length!==5){
        result.style.color="red";
        result.innerHTML="A kódnak pontosan 5 karakteresnek kell lennie!";
        return;
    }

    if(!Object.prototype.hasOwnProperty.call(validCodes, code)){
        result.style.color="red";
        result.innerHTML="Érvénytelen kód!";
        return;
    }

    if(!rules){
        result.style.color="red";
        result.innerHTML="Fogadd el a játékszabályzatot!";
        return;
    }

    const maxUses=validCodes[code];
    let s=JSON.parse(localStorage.getItem("used_code_"+code) || '{"uses":0,"history":[]}');
    if(s.uses>=maxUses){
        result.style.color="red";
        result.innerHTML="Ezt a kódot már felhasználta az összes ("+maxUses+") pörgetési lehetőséggel.";
        return;
    }

    spinning=true;
    result.style.color="#06326e";
    result.innerHTML="Pörgetés folyamatban...";

    const prize=getPrize();

    s.name=name;
    s.code=code;
    s.uses++;
    s.history.push(prize);
    localStorage.setItem("used_code_"+code,JSON.stringify(s));

currentRotation += 360 * 8 + (360 - getTargetDegree(prize));

// NEW smooth animation engine
let start = null;
let duration = 4000;
let startRotation = currentRotation;
let endRotation = currentRotation;

endRotation += 360 * 8 + (360 - getTargetDegree(prize));

function animate(timestamp){
    if(!start) start = timestamp;
    let progress = timestamp - start;

    let t = Math.min(progress / duration, 1);

    // ease-out cubic
    let eased = 1 - Math.pow(1 - t, 3);

    let current = startRotation + (endRotation - startRotation) * eased;

    wheel.style.transform = `translateZ(0) rotate(${current}deg)`;

    if(t < 1){
        requestAnimationFrame(animate);
    } else {
        currentRotation = endRotation;
    }
}

requestAnimationFrame(animate);

setTimeout(() => {

    const totalPrize = s.history.reduce((sum, value) => sum + value, 0);
    const remaining = maxUses - s.uses;

    result.style.color = "#06326e";

    // 👉 HA MÉG VAN PÖRGETÉS
    if(remaining > 0){
        result.innerHTML = `
        <div style="text-align:center;font-size:18px;font-weight:bold;">
            Hátralévő pörgetések száma: ${remaining}
        </div>
        `;
        spinning = false;
        return;
    }

    // 👉 NYEREMÉNYEK MONDATBAN
  const prizesList = s.history.map((p, i) => {
    const value = p.toLocaleString("hu-HU") + " Ft";

    if(i === 0) return value;
    if(i === s.history.length - 1) return " végül " + value;

    return " majd " + value;
}).join("");

const now = new Date().toLocaleString("hu-HU");

result.innerHTML = `
<div style="
    max-width:360px;
    margin:0 auto;
    background:#ffffff;
    border:2px dashed #ccc;
    border-radius:14px;
    padding:16px;
    box-shadow:0 6px 14px rgba(0,0,0,0.15);
">

    <div style="
        text-align:center;
        font-weight:bold;
        font-size:18px;
        margin-bottom:10px;
        color:#06326e;
    ">
        PÖRGETÉSI BIZONYLAT
    </div>

    <hr style="border-top:1px dashed #ccc;">

    <!-- 🔥 EZ A TELJES EGYMONDATOS RÉSZ -->
    <div style="
        font-size:14px;
        line-height:1.8;
        text-align:center;
    ">

        A <b style="color:#06326e;">${name}</b> nevű pörgető a 
        <b style="color:#06326e;">${code}</b> kóddal, 
        összesen <b style="color:#06326e;">${s.uses}</b> pörgetést hajtott végre, 
        melyek során 
        <span style="color:#28a745;font-weight:bold;">
            ${prizesList}
        </span>
        nyeremény vagy nyereményeket nyert meg, így az összes megnyert összeg 
        <b style="color:#d97706;">
            ${s.history.reduce((a,b)=>a+b,0).toLocaleString("hu-HU")} Ft
        </b>.

    </div>

    <hr style="border-top:1px dashed #ccc;margin:10px 0;">

    <!-- FONTOS -->
    <div style="
        text-align:center;
        background:#fff8d6;
        border:2px solid #ffcc00;
        border-radius:10px;
        padding:10px;
        font-size:13px;
        line-height:1.7;
    ">
        <b style="color:#d97706;">📸 FONTOS!</b><br>

        A pörgetés végén megjelenő bizonylatról <b>készíts képernyőképet</b>, és őrizd meg az eredmény igazolásához.
    </div>

    <hr style="border-top:1px dashed #ccc;margin:10px 0;">

    <!-- ALÁÍRÁS -->
    <div style="text-align:center;font-size:13px;">
        Nyereményedhez gratulálunk!<br>
        <b>VakációVágyó</b><br><br>
        <span style="font-size:12px;color:#666;">
            ${now}
        </span>
    </div>

</div>
`;
    spinning = false;

}, 4200);
}
</script>

</body>
</html>
