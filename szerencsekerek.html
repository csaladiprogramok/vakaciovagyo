<style>
.close-btn{
    position:absolute;
    top:8px;
    right:12px;

    font-size:20px;
    font-weight:700;
    color:#333;
    background:#f1f1f1;
    border:1px solid #ccc;
    border-radius:50%;
    width:32px;
    height:32px;
    display:flex;
    align-items:center;

.close-btn:hover{

*{

}

body{

.container{

h1{

.top-links{

}

.link-btn{
    display:inline-block;
    text-decoration:none;
    background:linear-gradient(135deg,#ffcc00,#ff8c00);
    color:#06326e;
    font-weight:bold;
    font-size:13px;

    border-radius:25px;
    box-shadow:0 3px 0 #b86600;
}

.link-btn:hover{
    transform:translateY(-1px);
}

.main{
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
}

.left,
.right{
    flex:1;
    min-width:240px;
}

p{
    margin:7px 0 3px;
    font-size:14px;
}

input,
select{
    width:100%;
    max-width:280px;
    padding:8px;
    font-size:14px;
    border-radius:10px;
    border:2px dashed #0077cc;
    text-align:center;
    margin-top:4px;
}

#codeInput{
    font-size:18px;
    letter-spacing:4px;
    text-transform:uppercase;
}

button{
    margin-top:10px;
    padding:10px 24px;
    border:none;
    border-radius:35px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#ffcc00,#ff8c00);
    color:#06326e;
}

.rules{
    margin-top:8px;
    display:flex;
    justify-content:center;
}

.rules-label{
    display:flex;
    align-items:flex-start;
    gap:8px;
    max-width:280px;
    text-align:center;
    line-height:1.25;
    font-size:14px;
}

.rules-label input{
    width:15px;
    height:15px;
    margin-top:2px;
    flex-shrink:0;
}

.rules-label a{
    color:#0056b3;
    font-weight:bold;
    text-decoration:none;
}

.wheel-wrap{
    position:relative;
    width:190px;
    height:190px;
    margin:auto;
}

.pointer{
    position:absolute;
    left:50%;
    top:-8px;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:15px solid transparent;
    border-right:15px solid transparent;
    border-top:28px solid #ffcc00;
    z-index:2;
}

.wheel{
    width:190px;
    height:190px;
    border-radius:50%;
    border:8px solid #ffcc00;
    background:conic-gradient(
        #e52626 0 54deg,
        #008bd2 54deg 306deg,
        #2fa84f 306deg 360deg
    );
    box-shadow:inset 0 0 0 4px #06326e,0 6px 12px rgba(0,0,0,.3);
    position:relative;
    transform:translateZ(0) rotate(0deg);
    will-change:transform;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
}

.wheel::after{
    content:"★";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:42px;
    height:42px;
    border-radius:50%;
    background:#ffcc00;
    border:3px solid #fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    color:#06326e;
}

.result{
    margin-top:10px;
    padding:9px;
    background:#fff;
    border-radius:10px;
    min-height:45px;
    font-size:14px;
}

.prizes{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
}

.prize{
    padding:6px 10px;
    border-radius:7px;
    color:#fff;
    font-weight:bold;
    font-size:13px;
}

.p1{background:#2fa84f;}
.p2{background:#008bd2;}
.p3{background:#7b3fa1;}
.p4{background:#e52626;}

.footer{
    margin-top:10px;
    background:#06326e;
    color:#fff;
    padding:7px;
    border-radius:8px;
    font-size:12px;
}

}

function getTargetDegree(p){
    // A kerék vizuális szektorai ugyanazokat az arányokat követik.
    // A szélektől pár fokkal beljebb állunk meg, hogy a mutató egyértelmű legyen.
    if(p===2000) return randomBetween(60,300);   // 70%
    if(p===500)  return randomBetween(312,354);  // 15%
    return randomBetween(6,48);                  // 1000 Ft, 15%
}

function closeTicketModal(){
    document.getElementById("ticketModal").classList.remove("open");
    document.body.classList.remove("modal-open");
    document.body.style.removeProperty("--scrollbar-compensation");
}

document.addEventListener("keydown", e => {
    if(e.key === "Escape") closeTicketModal();
});

document.addEventListener("click", e => {
    const modal = document.getElementById("ticketModal");
    if(e.target === modal) closeTicketModal();
});

function spinWheel(){
    const name=document.getElementById("nameInput").value.trim();
    const code=document.getElementById("codeInput").value.replace(/\s+/g,"").trim().toUpperCase();
    const rules=document.getElementById("acceptRules").checked;
    const result=document.getElementById("result");
    const wheel=document.getElementById("wheel");

    if(spinning)return;

    if(name.length<2){
        result.style.color="red";
        result.innerHTML="Add meg a neved!";
        return;
    }

    if(code.length!==5){
        result.style.color="red";
        result.innerHTML="A kódnak pontosan 5 karakteresnek kell lennie!";
        return;
    }

    if(!Object.prototype.hasOwnProperty.call(validCodes, code)){
        result.style.color="red";
        result.innerHTML="Érvénytelen kód!";
        return;
    }

    if(!rules){
        result.style.color="red";
        result.innerHTML="Fogadd el a játékszabályzatot!";
        return;
    }

    const maxUses=validCodes[code];
    let s=JSON.parse(localStorage.getItem("used_code_"+code) || '{"uses":0,"history":[]}');
    if(s.uses>=maxUses){
        result.style.color="red";
        result.innerHTML="Ezt a kódot már felhasználta az összes ("+maxUses+") pörgetési lehetőséggel.";
        return;
    }

    spinning=true;
    result.style.color="#06326e";
    result.innerHTML="Pörgetés folyamatban...";

    const prize=getPrize();

    s.name=name;
    s.code=code;
    s.uses++;
    s.history.push(prize);
    localStorage.setItem("used_code_"+code,JSON.stringify(s));

// Stabil kerék-animáció: CSS transitionnel pörgetjük, így mobilon is megbízható.
const duration = 4000;
const targetDegree = getTargetDegree(prize);
const startRotation = currentRotation;
const endRotation = startRotation + (360 * 8) + (360 - targetDegree);

// Előző animáció maradványainak törlése, majd az induló állapot rögzítése.
wheel.style.transition = "none";
wheel.style.transform = `translate3d(0,0,0) rotate(${startRotation}deg)`;
void wheel.offsetWidth; // böngésző újrarajzolás kikényszerítése

// A következő képkockában indul a tényleges forgás.
requestAnimationFrame(() => {
    requestAnimationFrame(() => {
        wheel.style.transition = `transform ${duration}ms cubic-bezier(0.12, 0.72, 0.18, 1)`;
        wheel.style.transform = `translate3d(0,0,0) rotate(${endRotation}deg)`;
    });
});

currentRotation = endRotation;

setTimeout(() => {

    const totalPrize = s.history.reduce((sum, value) => sum + value, 0);
    const remaining = maxUses - s.uses;

    result.style.color = "#06326e";

    // 👉 HA MÉG VAN PÖRGETÉS
    if(remaining > 0){
        result.innerHTML = `
        <div style="text-align:center;font-size:18px;font-weight:bold;">
            Hátralévő pörgetések száma: ${remaining}
        </div>
        `;
        spinning = false;
        return;
    }

    // Egyszeri pörgetés: közvetlenül az egyetlen nyereményt jelenítjük meg.
    const now = new Date().toLocaleString("hu-HU");

const ticketModal = document.getElementById("ticketModal");
    const ticketModalContent = document.getElementById("ticketModalContent");
    ticketModalContent.innerHTML = `
<div style="
    max-width:360px;
    margin:0 auto;
    background:#ffffff;
    border:2px dashed #ccc;
    border-radius:14px;
    padding:16px;
    box-shadow:0 6px 14px rgba(0,0,0,0.15);
">

    <div style="
        text-align:center;
        font-weight:bold;
        font-size:18px;
        margin-bottom:10px;
        color:#06326e;
    ">
        PÖRGETÉSI BIZONYLAT
    </div>

    <hr style="border-top:1px dashed #ccc;">

    <!-- 🔥 EZ A TELJES EGYMONDATOS RÉSZ -->
    <div style="
        font-size:14px;
        line-height:1.8;
        text-align:center;
    ">

        A <b style="color:#06326e;">${name}</b> nevű pörgető a
        <b style="color:#06326e;">${code}</b> kóddal az egyszeri pörgetési lehetőségét felhasználta,
        és a pörgetés során
        <b style="color:#28a745;font-size:18px;">
            ${prize.toLocaleString("hu-HU")} Ft
        </b>
        nyereményt nyert.

    </div>

    <hr style="border-top:1px dashed #ccc;margin:10px 0;">

    <!-- FONTOS -->
    <div style="
        text-align:center;
        background:#fff8d6;
        border:2px solid #ffcc00;
        border-radius:10px;
        padding:10px;
        font-size:13px;
        line-height:1.7;
    ">
        <b style="color:#d97706;">📸 FONTOS!</b><br>

        A pörgetés végén megjelenő bizonylatról <b>készíts képernyőképet</b>, és őrizd meg az eredmény igazolásához.
    </div>

    <hr style="border-top:1px dashed #ccc;margin:10px 0;">

    <!-- ALÁÍRÁS -->
    <div style="text-align:center;font-size:13px;">
        Nyereményedhez gratulálunk!<br>
        <b>VakációVágyó</b><br><br>
        <span style="font-size:12px;color:#666;">
            ${now}
        </span>
    </div>

</div>
`;
    result.innerHTML = `Gratulálunk! <b>${prize.toLocaleString("hu-HU")} Ft</b> nyereményed lett. A bizonylat megnyílt.`;
    const scrollbarWidth = Math.max(0, window.innerWidth - document.documentElement.clientWidth);
    document.body.style.setProperty("--scrollbar-compensation", scrollbarWidth + "px");
    ticketModal.classList.add("open");
    document.body.classList.add("modal-open");
    spinning = false;

}, 4200);
}
</script>

</body>
